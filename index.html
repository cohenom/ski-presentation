<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skiing</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#0f1c2e;overflow:hidden}
#st{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;font-family:Rubik,Arial,sans-serif;color:#f4f7fa;cursor:pointer}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sh{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,20,35,.85) 0%,rgba(10,20,35,.35) 45%,rgba(10,20,35,0) 75%)}
.k,.h,.s{position:absolute;left:128px;width:1664px;margin:0;opacity:0;transform:translateY(40px);transition:opacity .6s,transform .6s}
.k{bottom:420px;font-size:32px;font-weight:500;color:#7fd4ff;letter-spacing:4px;text-transform:uppercase}
.h{bottom:210px;font-family:Oswald,Arial,sans-serif;font-size:180px;font-weight:700;line-height:1;text-transform:uppercase;transition-delay:.15s}
.s{bottom:128px;font-size:40px;color:#dfe8f0;transition-delay:.3s}
.in .k,.in .h,.in .s{opacity:1;transform:none}
#n{position:fixed;bottom:12px;right:16px;color:#fff8;font:16px Rubik,sans-serif}</style></head>
<body><div id="st"><img class="bg" id="bg"><div class="sh"></div><p class="k" id="k"></p><h1 class="h" id="h"></h1><p class="s" id="s"></p></div><div id="n"></div><script>
const S=[["title","A presentation by","Skiing","Omri Cohen · Matan Berkley"],
["history","01","Where it started","Thousands of years ago"],
["gear","02","The gear","Skis · Boots · Poles · Helmet · Goggles"],
["basics","03","First day","Pizza to stop. Fries to go."],
["lifts","04","The lifts","Chairlift · Gondola · T-bar"],
["end","Thanks","Questions?","Omri Cohen · Matan Berkley"]];
let i=0;
function fit(){const z=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`scale(${z}) translate(-50%,-50%)`}
function show(){const[a,b,c,d]=S[i];st.classList.remove("in");bg.src=a+".png";k.textContent=b;h.textContent=c;s.textContent=d;n.textContent=(i+1)+" / "+S.length;requestAnimationFrame(()=>requestAnimationFrame(()=>st.classList.add("in")))}
const go=d=>{i=Math.max(0,Math.min(S.length-1,i+d));show()};
addEventListener("keydown",e=>{if(["ArrowRight"," ","PageDown"].includes(e.key))go(1);if(["ArrowLeft","PageUp"].includes(e.key))go(-1)});
addEventListener("click",e=>{document.fullscreenElement||document.documentElement.requestFullscreen?.().catch(()=>{});go(e.clientX<innerWidth/3?-1:1)});
addEventListener("resize",fit);S.forEach(x=>new Image().src=x[0]+".png");fit();show();
const q=new URLSearchParams(location.search);if(q.has("play")){const ms=(+q.get("play")||6)*1000;setInterval(()=>{i=(i+1)%S.length;show()},ms)}
</script></body></html>
