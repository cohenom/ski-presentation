<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skiing</title>
<style>html,body{margin:0;height:100%;background:#000}img{width:100vw;height:100vh;object-fit:contain;display:block;cursor:pointer}#n{position:fixed;bottom:12px;right:16px;color:#fff8;font:16px sans-serif}</style></head>
<body><img id="s"><div id="n"></div><script>
const S=["title","history","basics","gear","lifts","tricks","safety","end"];let i=0;
const show=()=>{s.src=S[i]+".png";n.textContent=(i+1)+" / "+S.length};
const go=d=>{i=Math.max(0,Math.min(S.length-1,i+d));show()};
addEventListener("keydown",e=>{if(["ArrowRight"," ","PageDown"].includes(e.key))go(1);if(["ArrowLeft","PageUp"].includes(e.key))go(-1)});
s.onclick=e=>go(e.clientX<innerWidth/3?-1:1);S.forEach(x=>new Image().src=x+".png");show();
</script></body></html>
